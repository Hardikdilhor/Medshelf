<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedShelf — Orders</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f3ed;color:#171513}.wrap{max-width:980px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd6cc;border-radius:14px;padding:18px;margin:14px 0}.input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}.btn{padding:11px 15px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.load{background:#111;color:#fff}.deliver{background:#168b72;color:#fff}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#f2f4f7;font-size:12px;font-weight:700}.due{background:#fff3cd}.over{background:#ffe2e0;color:#b42318}.done{background:#dff8ef;color:#087c65}.item{padding:8px 0;border-bottom:1px solid #eee}.muted{color:#666;font-size:13px}.alert{padding:14px 16px;border-radius:10px;background:#fff8df;border:1px solid #ead99a;margin:14px 0;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>MedShelf Orders</h1><p class="muted">Private owner dashboard. Orders are shown only after Cashfree payment is verified.</p><div class="card"><label>Admin token</label><input id="token" class="input" type="password"><button class="btn load" style="margin-top:10px" onclick="loadOrders()">Load orders</button></div><div id="alert"></div><div id="orders"></div></div><script>const API='https://medshelf-payment-backend.vercel.app';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function cls(s){return s.startsWith('Overdue')?'over':(s==='Delivered'?'done':(s.startsWith('Due')?'due':''));}async function loadOrders(){const t=document.getElementById('token').value;const a=document.getElementById('alert');const box=document.getElementById('orders');a.textContent='Loading…';try{const r=await fetch(API+'/api/admin-orders',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load.');const orders=d.orders||[];const due=orders.filter(o=>o.delivery_label==='Due Today').length,over=orders.filter(o=>o.delivery_label.startsWith('Overdue')).length;a.innerHTML=(due||over)?`<div class="alert">🔔 Reminder: ${due} due today${over?` · ${over} overdue`:''}. Check these orders first.</div>`:'';box.innerHTML=orders.length?orders.map(o=>`<div class="card"><h2>${esc(o.order_number)} — ₹${(Number(o.amount)/100).toLocaleString('en-IN')}</h2><span class="badge ${cls(o.delivery_label)}">${esc(o.delivery_label)}</span><p><b>${esc(o.customer_name)}</b> · ${esc(o.customer_phone)} · ${esc(o.customer_email)}</p><p>${esc(o.address)}, ${esc(o.city)}, ${esc(o.state)} - ${esc(o.pin)}</p><p><b>Ordered:</b> ${new Date(o.created_at).toLocaleString('en-IN')}<br><b>Delivery target:</b> ${new Date(o.delivery_deadline).toLocaleDateString('en-IN')}</p><div><b>Books / notes</b>${(o.items||[]).map(x=>`<div class="item">${esc(x.title)} × ${Number(x.quantity)} — ₹${(Number(x.unit_price*x.quantity)/100).toLocaleString('en-IN')}</div>`).join('')}</div>${o.order_status==='delivered'?'<p class="done" style="padding:9px;border-radius:8px"><b>✓ Delivered</b></p>':`<button class="btn deliver" style="margin-top:14px" onclick="markDelivered('${esc(o.id)}')">✓ Mark as Delivered</button>`}</div>`).join(''):'<div class="card">No paid orders yet.</div>';a.textContent='';}catch(e){a.textContent=e.message;}}async function markDelivered(id){const t=document.getElementById('token').value;if(!confirm('Mark this order as delivered?'))return;const r=await fetch(API+'/api/admin-orders',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({id,action:'delivered'})});const d=await r.json();if(!r.ok){alert(d.error||'Could not update order.');return;}loadOrders();}loadOrders();</script></body></html>
