<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedShelf — Payment Review</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f3ed;color:#171513}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd6cc;border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:11px 16px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.approve{background:#168b72;color:#fff}.reject{background:#b42318;color:#fff}.input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}.proof{max-width:320px;max-height:420px;object-fit:contain;border:1px solid #ddd;border-radius:8px;background:#fafafa}.muted{color:#666;font-size:13px}.hidden{display:none}.ok{color:#168b72}.bad{color:#b42318}</style></head><body><div class="wrap"><h1>MedShelf payment review</h1><p class="muted">Review the customer's UPI proof against your own bank/UPI transaction history. A screenshot alone is not proof of receipt.</p><div class="card"><label>Admin review token</label><input id="token" class="input" type="password" autocomplete="off"><button class="btn" style="margin-top:10px" onclick="loadOrders()">Load pending payments</button><span id="msg" class="muted"></span></div><div id="orders"></div></div><script>const API='https://medshelf-payment-backend.vercel.app';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function loadOrders(){const t=document.getElementById('token').value;const msg=document.getElementById('msg');msg.textContent=' Loading…';try{const r=await fetch(API+'/api/admin-orders',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load.');document.getElementById('orders').innerHTML=d.orders.length?d.orders.map(x=>{const o=x.orders||{};return `<div class="card"><h2>${esc(o.order_number)} — ₹${(Number(o.amount||0)/100).toFixed(2)}</h2><p><b>${esc(o.customer_name)}</b> · ${esc(o.customer_phone)} · ${esc(o.customer_email)}</p><p>${esc(o.address)}, ${esc(o.city)}, ${esc(o.state)} - ${esc(o.pin)}</p><p><b>UTR:</b> ${esc(x.utr)}<br><b>Customer payment time:</b> ${esc(x.claimed_paid_at)}</p><img class="proof" src="${esc(x.screenshotUrl)}" alt="Payment screenshot"><div class="row" style="margin-top:14px"><button class="btn approve" onclick="review('${esc(x.id)}','approve')">Approve — payment received</button><button class="btn reject" onclick="review('${esc(x.id)}','reject')">Reject</button></div></div>`}).join(''):'<div class="card">No pending manual payments.</div>';msg.textContent=' Loaded.';}catch(e){msg.textContent=' '+e.message;}}async function review(id,action){const t=document.getElementById('token').value;if(!confirm(action==='approve'?'Confirm that you checked your actual UPI/bank transaction and received the full amount?':'Reject this payment proof?'))return;const r=await fetch(API+'/api/admin-orders',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({id,action})});const d=await r.json();if(!r.ok){alert(d.error||'Review failed.');return;}alert(action==='approve'?'Order approved.':'Payment rejected.');loadOrders();}</script></body></html>
